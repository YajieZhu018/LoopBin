# Full-pipeline env (conda): covers preprocess/process (needs `cooler` + the
# bigWigAverageOverBed binary, subprocess-called from loopbin/fn/preprocess.py) through
# train/cluster/merge. Trimmed from a raw `conda env export` dump down to just what
# loopbin/ actually imports (verified by AST-scanning the package) plus that one
# external binary -- the original dump carried ~150 transitive/dev packages (jupyter,
# dask, Qt/PyQt, pytest, ...) never used by the package itself.
#
# Package *versions* below are kept in sync with requirements.txt's (the pip/uv
# equivalent, which also now covers process, verified separately on Python 3.9) so the
# two environments behave the same regardless of which one you set up -- only Python
# itself differs (3.7 here vs 3.9 there; both work with these same pins). See
# requirements.txt for why cooler is pinned to 0.9.3 rather than latest.
#
# For a leaner, training + process (no preprocess) alternative, see requirements.txt
# instead -- see README.md's ## Install.
name: loopbin
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.7.9
  - cooler=0.9.3
  - ucsc-bigwigaverageoverbed=377
  - matplotlib=3.5.3
  - pandas=1.3.5
  - scipy=1.7.3
  - scikit-learn=1.0.2
  - pip:
      - numpy==1.19.5      # tensorflow==2.5.0 requires numpy<1.20
      - tensorflow==2.5.0
      - seaborn==0.11.2
      - six==1.15.0
      - kneed==0.8.5
      - tqdm==4.70.0
